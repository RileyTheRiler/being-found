name: Being Found quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: being-found-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BF_TEST_URL: http://127.0.0.1:8770/index.html
      BF_TEST_ARTIFACTS: qa-artifacts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned accessibility auditor
        run: npm ci

      - name: Build production game
        run: npm run build

      - name: 8.5.2A policy and QA manifest
        run: |
          node qa_flags.js
          python3 qa_all.py --list

      - name: Pilot analysis self-test and empty template
        run: |
          python3 pilot_summary.py --self-test
          python3 pilot_summary.py pilot/observations.csv

      - name: Parse source and built JavaScript
        run: python3 qa_js_syntax.py

      - name: Install browser test runner
        run: python -m pip install 'playwright==1.58.0'

      - name: Find Chrome
        shell: bash
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium browser available on the runner"
            exit 1
          fi
          echo "BF_CHROME=$CHROME" >> "$GITHUB_ENV"

      - name: Serve built game
        shell: bash
        run: |
          python3 -m http.server 8770 --directory dist > /tmp/being-found-http.log 2>&1 &
          echo $! > /tmp/being-found-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8770/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/being-found-http.log
          exit 1

      - name: Authored text and production editorial guard
        run: python3 qa_editorial.py

      - name: Wren and Ilse runtime narrative regression
        run: python3 qa_wren_ilse.py

      - name: Remaining-resident runtime editorial regression
        run: python3 qa_remaining_scenes.py

      - name: Guided classroom 8.4 chapter and reflection regression
        run: python3 qa_guided84.py

      - name: Dele consent and exit branch regression
        run: python3 qa_consent_branches.py

      - name: Guided input parity and capability regression
        run: python3 qa_route_no_capability.py

      - name: Guided and pilot movement speed parity
        run: node qa_speed_parity.js

      - name: Guided keyboard and reduced-motion accessibility regression
        run: python3 qa_access85.py

      - name: Walt reduced-motion transcript and preserved silences
        run: python3 qa_reduced_motion_walt.py

      - name: Reduced-motion front-door transition and ordinary pacing
        run: python3 qa_reduced_motion_fade.py

      - name: Title keyboard dialog focus and isolation
        run: python3 qa_title_focus.py

      - name: Axe-core accessibility (guided checkpoints)
        run: python3 qa_axe.py

      - name: Heavy-action keyboard and pointer regression
        run: python3 qa_heavy_access.py

      - name: Five viewport smoke tests
        run: python3 qa_smoke.py

      - name: Tablet portrait Guide, orientation and target-size regression
        run: python3 qa_tablet_guide.py

      - name: Lying resident bed depth and position across devices
        run: python3 qa_lying_bed.py

      - name: Character walking and sofa depth
        run: python3 qa_character_motion.py

      - name: Phone pickup, held pose and return
        run: python3 qa_phone_motion.py

      - name: Staged sofa, cooking and painting animation
        run: python3 qa_physical_actions.py

      - name: Articulated sofa legs and rise across devices
        run: python3 qa_seated_rig.py

      - name: Route and menu tests
        run: python3 menu_check.py

      - name: Persistent save and resume test
        run: python3 qa_save_resume.py

      - name: Reflect dialog keyboard focus test
        run: python3 qa_focus.py

      - name: Opt-in soundtrack regression
        run: python3 qa_audio.py

      - name: Five flats stove and mobile Dele hint
        run: python3 qa_flats_stove.py

      - name: Existing state-preservation test
        run: python3 test_prop_states.py

      - name: Existing story / follow-up tests
        run: |
          python3 e2e_sync.py 390x844
          python3 test_later.py 390x844

      - name: Encounter and visit checks
        run: |
          python3 dele_check.py
          python3 visit_check.py

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: being-found-qa
          path: |
            qa-artifacts/
            v81_*.png
          if-no-files-found: ignore
          retention-days: 7
